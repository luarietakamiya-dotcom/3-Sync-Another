</style></head><body><article class="article"><header><p class="label">STORY</p><h1>GAME START!  劇場版3-Sync</h1><p class="author">Katsunn</p></header><div class="body"><p>ある日レトロゲームを買ってきた3-Syncの3人。ゲームスタートした瞬間にそのゲームの中の世界に転生されちゃった！ゲームに登場する猫乙女の2人と一緒に終わりの無いゲームから脱出を目指す旅に出る。だけど終わりの無いラストがテーマになっているこのゲームの世界から無事に元の世界に帰ることが出来るのでしょうか！？</p></div></article></body></html>
