</style></head><body><article class="article"><header><p class="label">CHARACTER / SETTING</p><h1>劇場版3-Sync -　百八鬼夜行</h1><p class="author">アキ / Aki</p></header><div class="body"><p>異界に暮らし、人の縁、居場所、ささやかな幸福を守る妖怪。 幼く無邪気な姿をしているが、異界の変化や現世から流れ込む感情を敏感に察知する力を持つ。戦闘能力は高くなく、ノイズを直接倒すことはできないが、異なる世界をつないだり、迷い込んだ者を目的地へ導いたりすることに長けている。 趣味　食べ歩き 好きな食べ物　アイスクリーム</p></div></article></body></html>
