</style></head><body><article class="article"><header><p class="label">STORY</p><h1>劇場版3-Sync公開記念！映画館でのマナーを守ろうの巻</h1><p class="author">今日はこれでいいやの人</p></header><div class="body"><p>「劇場版3-Sync」の完成試写会に訪れた一行、映画を楽しんでいた3人だったが、背後にら頭部がカメラになっている謎の集団が…。「ちょっと！映画館での動画撮影は犯罪よ！」「NO MORE映画泥棒！」「ポップコーン美味しい」集団を注意する3人だったが、集団は聞く耳を持たないどころか、別の映画で使用されていた光る剣を取り出し3人に襲いかかる！「あぶない！」そこに現れたのは映画ではなく3-Syncを盗撮していた南黒山ソイヤだった。</p></div></article></body></html>
